<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dépôt d’une contribution — banc PT06</title>
<style>
*{box-sizing:border-box}body{font:1.1rem/1.5 system-ui;margin:1rem;color:#202020;background:#fff}main{max-width:40rem;margin:auto}label{display:block;font-weight:600;margin-top:1rem}input,textarea,button{font:inherit;max-width:100%}input,textarea{width:100%;padding:.5rem;border:2px solid #444}button{padding:.5rem 1rem;margin-top:1rem;background:#fff;color:#202020;border:2px solid #444}a{color:#143ac4}:focus-visible{outline:3px solid #143ac4;outline-offset:3px}.error{color:#a00000}textarea{min-height:8rem}
</style>
<body><a href="#main" id="skip">Aller au formulaire</a><main id="main" tabindex="-1">
<h1>Déposer une contribution</h1><p>Votre texte reste enregistré localement. La réception ne vaut pas intégration ni validation scientifique.</p>
<div id="errors" role="alert" tabindex="-1" hidden></div>
<form id="form" novalidate>
<label for="origin">Référence de la contribution</label><input id="origin" required aria-describedby="origin-help"><p id="origin-help">Choisissez une référence stable pour reprendre votre dépôt.</p>
<label for="delta">Texte de votre contribution</label><textarea id="delta" required></textarea>
<button id="send" type="submit">Envoyer la contribution</button>
</form><p id="status" role="status" aria-live="polite" aria-atomic="true"></p></main>
<script>
const origin=document.getElementById('origin'),delta=document.getElementById('delta'),errors=document.getElementById('errors'),status=document.getElementById('status');
delta.value=localStorage.getItem('pt06-own-delta')||'';
delta.addEventListener('input',()=>localStorage.setItem('pt06-own-delta',delta.value));
document.getElementById('form').addEventListener('submit',async event=>{
event.preventDefault();errors.hidden=true;errors.textContent='';status.textContent='';
const invalid=[origin,delta].filter(field=>!field.value.trim());
[origin,delta].forEach(field=>field.setAttribute('aria-invalid',invalid.includes(field)?'true':'false'));
if(invalid.length){errors.hidden=false;errors.className='error';errors.textContent='Complétez la référence et le texte avant l’envoi.';errors.focus();return}
status.textContent='Envoi en cours.';document.getElementById('send').disabled=true;
try{const response=await fetch('/receive',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer S1','X-Device':'D','X-Client-Version':'2'},body:JSON.stringify({origin:origin.value,format:2,delta:{target:'visible',text:delta.value,concept:'known'}})});
if(response.status!==202)throw new Error('refused');status.textContent='Contribution reçue. Intégration non confirmée.';
}catch(error){errors.hidden=false;errors.className='error';errors.textContent='Envoi refusé ou indisponible. Votre texte local est conservé.';errors.focus()}
finally{document.getElementById('send').disabled=false}
});
</script></body></html>
